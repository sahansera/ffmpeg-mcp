name: tests

on:
  push:
    branches:
      - main
      - fix/ffmpeg-timeout-performance
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      - name: Run unit tests
        run: uv run python -m unittest discover -s tests -v
