name: tests

on:
  push:
    branches:
      - main
      - fix/ffmpeg-timeout-performance
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --python 3.13
      - name: Run unit tests
        run: uv run --python 3.13 python -m unittest discover -s tests -v
